name: Build Crazy Alarm APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Crazy_Alarm_Native_Android_v3.zip'
      - '.github/workflows/build-crazy-alarm-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Unpack Crazy Alarm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          unzip -q Crazy_Alarm_Native_Android_v3.zip -d build
          test -f build/alarm/settings.gradle.kts
          test -f build/alarm/app/src/main/AndroidManifest.xml

      - name: Install supplied launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/alarm/app/src/main/res/drawable-nodpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAABBmlDQ1BJQ0MgUHJvZmlsZQAAeJxjYGCS' > /tmp/icon_prefix_check
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = '''ICON_BASE64_PLACEHOLDER'''
          Path('build/alarm/app/src/main/res/drawable-nodpi/app_icon.png').write_bytes(base64.b64decode(data))
          PY
          test -s build/alarm/app/src/main/res/drawable-nodpi/app_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/alarm/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<application android:theme="@style/AppTheme" android:label="Crazy Alarm" android:allowBackup="true">', '<application android:theme="@style/AppTheme" android:label="Crazy Alarm" android:allowBackup="true" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon">')
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: build/alarm
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/alarm/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build/alarm/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crazy-alarm-apk
          path: build/alarm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
